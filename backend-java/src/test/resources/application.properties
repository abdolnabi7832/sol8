# Test Configuration
spring.datasource.url=jdbc:h2:mem:test_macro_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.storage.excel-logs-path=./target/test-data/Excel_Logs
app.storage.database-path=./target/test-data/h2db
app.ingestion.enabled=true
app.ingestion.init-seed-on-startup=true
app.ingestion.run-on-startup=false
