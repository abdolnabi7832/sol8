# ===================================================================
# Forex Intelligence Suite — Institutional Command Center (Phase 1)
# Production Application Configuration
# ===================================================================

server.port=8080
spring.application.name=forex-intelligence-suite

# -------------------------------------------------------------------
# Persistent Disk Database (H2 Engine with AUTO_SERVER Multi-Process)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/h2db/forex_macro_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=institutional_macro_sec_2026

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# H2 Web Management Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# Dynamic Storage & Excel/JSON Log Synchronization Paths
# -------------------------------------------------------------------
app.storage.excel-logs-path=./data/Excel_Logs
app.storage.database-path=./data/h2db
app.storage.atomic-temp-extension=.tmp
app.storage.max-lock-retry-attempts=5
app.storage.lock-retry-wait-millis=800

# -------------------------------------------------------------------
# Stealth Ingestion Engine Parameters & Anti-Scraping Protection
# -------------------------------------------------------------------
app.ingestion.enabled=true
app.ingestion.init-seed-on-startup=true
app.ingestion.run-on-startup=true
app.ingestion.jitter-min-millis=300
app.ingestion.jitter-max-millis=800
app.ingestion.max-retries=1
app.ingestion.backoff-multiplier=1.5
app.ingestion.connect-timeout-millis=4000
app.ingestion.read-timeout-millis=7500

# External Endpoints
app.endpoints.trading-economics-base-url=https://tradingeconomics.com
app.endpoints.forex-factory-calendar-url=https://www.forexfactory.com/calendar
app.endpoints.forex-factory-json-feed-url=https://nfs.faireconomy.media/ff_calendar_thisweek.json

# -------------------------------------------------------------------
# Actuator & Logging Configuration
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.institutional.forex=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
