[build]
builder = "DOCKERFILE"
dockerfilePath = "02 - Forex - Pro - Copy/backend-java/Dockerfile"

[deploy]
startCommand = "java -Dfile.encoding=UTF-8 -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -jar app.jar"
healthcheckPath = "/actuator/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
